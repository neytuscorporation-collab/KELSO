<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>KELSO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0a0a0a;--s:#141414;--s2:#1d1d1d;--line:#302b20;--fg:#f7f5ef;--mu:#9d978a;--gold:#d4af37;--gd:#a8841f;--red:#e2503c;--green:#4fbf7a;--h:"Montserrat","Segoe UI",system-ui,sans-serif;--b:"Inter",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--b);margin:0;padding-inline:16px}
[hidden]{display:none!important}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.w{max-width:440px;margin:0 auto;padding-bottom:48px;text-align:center}
.hero{position:relative;margin:0 -16px;padding:34px 16px 0;min-height:860px;overflow:hidden}
.hero>*{position:relative;z-index:1}
.sky{position:absolute!important;z-index:0!important;inset:0 0 auto 0;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 74%,transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 74%,transparent 100%)}
.sky img{display:block;width:100%;height:auto}
.logo{width:76px;height:76px;margin-top:6px;filter:drop-shadow(0 0 22px rgba(212,175,55,.45))}
h1.gold{background:linear-gradient(180deg,#f6e08a,#d4af37 55%,#a8841f);-webkit-background-clip:text;background-clip:text;color:transparent;font:700 46px/1 var(--h);letter-spacing:.14em;margin:10px 0 0 .14em;filter:drop-shadow(0 2px 8px rgba(0,0,0,.55))}
.sl2,.by2{display:flex;align-items:center;gap:10px;justify-content:center;text-transform:uppercase}
.sl2{font:700 11.5px var(--h);letter-spacing:.12em;margin-top:6px;color:#fff;text-shadow:0 2px 8px #000}
.by2{color:var(--gold);font:700 12px var(--h);letter-spacing:.14em;margin-top:6px}
.sl2 i,.by2 i,.copy i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold));display:block}
.sl2 i:last-child,.by2 i:last-child,.copy i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
h2{font:600 14px var(--h);letter-spacing:.2em;text-transform:uppercase;margin:0 0 14px}
h3{font:600 12px var(--h);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:20px 0 8px;text-align:left}
.wl{margin-top:330px;text-shadow:0 2px 10px #000}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:rgba(8,8,8,.82);border:1.5px solid var(--gold);border-radius:12px;padding:14px;font-weight:600;text-align:left;width:100%}
.opt svg{width:22px;height:22px;flex:none}.opt .chev{margin-left:auto;color:var(--gold);font-size:24px;line-height:1;font-style:normal}
.fine{color:#ddd8c8;font-size:11.5px;margin-top:12px}.fine a{color:var(--gold)}
.copy{display:flex;align-items:center;gap:12px;margin-top:26px;color:var(--mu);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.hero .fine,.hero .copy{text-shadow:0 1px 6px #000;position:relative}
.page{padding-top:26px}.page .logo{margin:0 auto 8px;display:block;width:60px;height:60px}
.btn{display:block;width:100%;background:linear-gradient(180deg,#e2c25a,var(--gd));color:#1a1405;border:0;border-radius:12px;padding:15px;font:700 14px var(--h);letter-spacing:.12em;text-transform:uppercase;margin-top:14px}
.btn.sec{background:var(--s);color:var(--fg);border:1.5px solid var(--line)}
.btn.red{background:var(--red);color:#fff}.btn.green{background:var(--green);color:#06210f}
.btn.sm{display:inline-block;width:auto;padding:10px 14px;font-size:12px;margin:6px 6px 0 0}
.btn[disabled]{opacity:.45}
.back{background:none;border:0;color:var(--mu);font-size:13px;display:block;margin:0 0 12px;padding:0}
label{display:block;text-align:left;color:var(--mu);font:700 11px var(--b);letter-spacing:.1em;text-transform:uppercase;margin:14px 0 6px}
input[type=text],input[type=tel],textarea{width:100%;background:var(--s2);border:1.5px solid var(--line);border-radius:10px;padding:13px;font-size:16px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.msg{margin-top:12px;font-size:13px;min-height:18px}.msg.err{color:#ffb4a8}.msg.ok{color:var(--green)}
.card{background:var(--s);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:left;margin-top:14px}
.card b{display:block}.card .mu{color:var(--mu);font-size:13px}.card p{margin:8px 0 0}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font:700 11px var(--b);letter-spacing:.06em;text-transform:uppercase;margin-top:8px}
.badge svg{width:15px;height:15px}
.b-ok{background:rgba(212,175,55,.16);color:var(--gold);border:1px solid var(--gd)}
.b-wait{background:rgba(240,200,60,.12);color:#f0c83c;border:1px solid #6b5a1c}
.b-bad{background:rgba(226,80,60,.14);color:#ff9a8a;border:1px solid #6b2a20}
.b-none{background:var(--s2);color:var(--mu);border:1px solid var(--line)}
.st{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:10px;color:var(--mu)}.dot{width:9px;height:9px;border-radius:50%;background:var(--mu)}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
.steps{display:flex;gap:6px;margin:0 0 18px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--gold)}
.chk{display:flex;gap:10px;text-align:left;color:#cfc9b8;font-size:12.5px;margin-top:12px;align-items:flex-start}.chk input{margin-top:3px;accent-color:#d4af37;flex:none;width:18px;height:18px}
.legal{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;font-size:12.5px;color:#cfc9b8;max-height:210px;overflow:auto}
.shot{width:100%;border-radius:12px;border:1.5px solid var(--line);display:block;margin-top:8px;background:#000}
.shotbox{aspect-ratio:3/4;border:2px dashed var(--gold);border-radius:14px;display:grid;place-items:center;color:var(--mu);font-size:13px;margin-top:8px;overflow:hidden}
.shotbox.doc{aspect-ratio:1.58}.shotbox img{width:100%;height:100%;object-fit:cover}
ul.tips{text-align:left;color:var(--mu);font-size:13px;padding-left:18px;margin:10px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.item{background:var(--s);border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-top:10px;text-align:left}
.item b{display:block}.item .mu{color:var(--mu);font-size:12.5px}
.seg{display:flex;background:var(--s);border:1.5px solid var(--line);border-radius:10px;padding:3px;margin:6px 0 4px}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:9px;font-weight:700;color:var(--mu);font-size:13px}
.seg button[aria-pressed=true]{background:var(--gold);color:#1a1405}
.imgs{display:grid;gap:8px;margin-top:8px}.imgs img{width:100%;border-radius:10px;border:1px solid var(--line)}
#vCam{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
#vCam video{flex:1;min-height:0;width:100%;object-fit:cover}
#vCam .guide{position:absolute;inset:0 0 120px 0;display:grid;place-items:center;pointer-events:none}
#vCam .frame{border:3px solid var(--gold);box-shadow:0 0 0 999px rgba(0,0,0,.45)}
#vCam .frame.face{width:62%;aspect-ratio:3/4;border-radius:50%}
#vCam .frame.id{width:88%;aspect-ratio:1.58;border-radius:14px}
#vCam .bar{height:120px;background:#000;display:flex;align-items:center;justify-content:center;gap:18px;padding:0 16px}
#vCam .bar .btn{margin:0;width:auto;padding:14px 22px}
#vCam .cap{position:absolute;top:0;left:0;right:0;padding:16px;text-align:center;font:600 14px var(--h);letter-spacing:.08em;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)}
#vCam .err{position:absolute;inset:0 0 120px 0;display:grid;place-items:center;padding:24px;text-align:center;color:#ffb4a8}

nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,10,.96);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:center;gap:4px}
nav#nav button{flex:1;max-width:110px;background:none;border:0;color:var(--mu);font:600 10.5px var(--h);letter-spacing:.06em;text-transform:uppercase;display:grid;gap:3px;justify-items:center;padding:6px 2px;border-radius:10px}
nav#nav button svg{width:22px;height:22px}nav#nav button[aria-current=true]{color:var(--gold)}
body.hasnav .w{padding-bottom:90px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--s);border:1.5px solid var(--line);color:var(--mu);border-radius:999px;padding:7px 12px;font:600 12px var(--b)}.chip[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
input[type=search],select{width:100%;background:var(--s2);border:1.5px solid var(--line);border-radius:10px;padding:13px;font-size:16px;color:var(--fg)}
.post{background:var(--s);border:1.5px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden;text-align:left}
.post .ph{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;background:#000}.post .ph img{flex:none;width:100%;max-height:300px;object-fit:cover;scroll-snap-align:start}
.post .in{padding:14px}.post .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.post .ti{font:700 15px var(--h)}.post .pr{color:var(--gold);font:700 16px var(--h);white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{background:var(--s2);border:1px solid var(--line);color:#cfc9b8;border-radius:999px;padding:3px 9px;font-size:11.5px}
.post p{margin:8px 0 0;color:#cfc9b8;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.seller{margin-top:10px;font-size:12.5px;color:var(--mu);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.seller b{color:var(--fg)}
.sold{background:rgba(226,80,60,.14);color:#ff9a8a;border:1px solid #6b2a20;border-radius:999px;padding:3px 9px;font:700 10.5px var(--b);text-transform:uppercase}
a.btn{text-decoration:none;text-align:center}
.thumbs{display:flex;gap:8px;margin-top:8px}.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat div{background:var(--s);border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left;color:var(--mu);font-size:12px}.stat b{display:block;color:var(--gold);font:700 24px var(--h)}
select{appearance:none}
</style></head><body><div class="w">

const ERR = {
  "auth/popup-closed-by-user": "Cerraste la ventana antes de terminar.",

const SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v7c0 5-4 8-8 10-4-2-8-5-8-10V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>';

/* ---------- ingreso ---------- */
async function loginGoogle() {
  $("wMsg").textContent = "";
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(auth, p); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      try { await signInWithRedirect(auth, p); return; } catch (e2) { e = e2; }
    }
    $("wMsg").textContent = errText(e);
  }
}
$("bGoogle").onclick = loginGoogle;
getRedirectResult(auth).catch((e) => { $("wMsg").textContent = errText(e); });

/* ---------- sesión y perfil ---------- */
let me = null, profile = null, isAdmin = false, unsub = null, dbErr = "", view = "load";
onAuthStateChanged(auth, async (u) => {
  if (unsub) { unsub(); unsub = null; }
  profile = null; isAdmin = false; dbErr = "";
  if (!u) { me = null; stopPosts(); tab = "in"; view = "welcome"; show("vWelcome"); return; }
  me = { uid: u.uid, name: u.displayName || "", email: u.email || "", provider: (u.providerData[0] && u.providerData[0].providerId) || "google.com" };
  view = "load"; show("vLoad");
  try { isAdmin = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch (e) { isAdmin = false; }
  unsub = onSnapshot(doc(db, "users", u.uid), async (snap) => {
    profile = snap.exists() ? snap.data() : null; dbErr = "";
    if ((!profile || !profile.status) && isAdmin) {
      try { await setDoc(doc(db, "users", u.uid), { name: me.name, email: me.email, provider: me.provider, status: "verificado", dni: "", phone: "", city: "", createdAt: serverTimestamp() }); } catch (e) { dbErr = errText(e); }
    }
    if (view === "load" || view === "home") enterHome();
  }, (e) => { dbErr = errText(e); if (view === "load" || view === "home") enterHome(); });
});

function statusOf() { return profile && profile.status ? profile.status : "none"; }
function badge(st) {
  if (st === "verificado") return '<span class="badge b-ok">' + SHIELD + 'Verificado</span>';
  if (st === "pendiente") return '<span class="badge b-wait">Pendiente de revisión</span>';

  if (st === "rechazado") return '<span class="badge b-bad">Rechazado</span>';

  return '<span class="badge b-none">Sin verificar</span>';
}
function renderHome() {
  const st = statusOf(), who = (profile && profile.name) || me.name || me.email;

  if (st === "rechazado") h += '<p>Tu solicitud fue rechazada.' + (profile.note ? ' Motivo: ' + esc(profile.note) : '') + '</p>';
  if (st === "suspendido") h += '<p>Tu cuenta está suspendida temporalmente.' + (profile.note ? ' ' + esc(profile.note) : '') + '</p>';
  if (st === "verificado") h += '<p>Tu cuenta está verificada. Ya puedes publicar y ver ejemplares y productos en las pestañas de abajo.</p>';
  h += '<div class="st"><i class="dot ' + (dbErr ? "bad" : "ok") + '"></i><span>' + (dbErr ? esc(dbErr) : "Base de datos conectada") + '</span></div></div>';
  if (st === "none" || st === "correccion") h += '<button class="btn" id="hStart" type="button">' + (st === "none" ? "Verificar mi identidad" : "Enviar de nuevo mis datos") + '</button>';

  $("hBody").innerHTML = h;
  if ($("hStart")) $("hStart").onclick = startWizard;
  if ($("hAdmin")) $("hAdmin").onclick = openAdmin;
}

/* ---------- cámara ---------- */
let stream = null, camResolve = null;
function stopCam() { if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } $("camVid").srcObject = null; }
function compress(src, maxSide, maxChars) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      let side = maxSide, q = 0.72, out = "";
      for (let i = 0; i < 8; i++) {
        const r = Math.min(1, side / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length <= maxChars) return res(out);
        side = Math.round(side * 0.85); q = Math.max(0.5, q - 0.05);
      }
      rej(new Error("size"));
    };
    im.onerror = rej; im.src = src;
  });
}
function takePhoto(kind) { // kind: selfie | front | back
  return new Promise(async (resolve) => {
    camResolve = resolve;
    const face = kind === "selfie";
    $("camCap").textContent = kind === "selfie" ? "Selfie: rostro dentro del óvalo" : kind === "front" ? "DNI: cara delantera" : "DNI: cara posterior";
    $("camFrame").className = "frame " + (face ? "face" : "id");
    $("camErr").hidden = true; $("camSnap").disabled = false; $("vCam").hidden = false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: face ? "user" : { ideal: "environment" }, width: { ideal: 1600 } }, audio: false });
      $("camVid").srcObject = stream; $("camVid").style.transform = face ? "scaleX(-1)" : "none";
      await $("camVid").play().catch(() => {});
    } catch (e) {
      $("camErr").hidden = false; $("camSnap").disabled = true;
      $("camErr").innerHTML = "No se pudo abrir la cámara.<br>Permite el acceso a la cámara en tu navegador y vuelve a intentar, o usa el botón de abajo.<br><br><button class='btn sec sm' id='camAlt' type='button'>Abrir la cámara del teléfono</button>";
      $("camAlt").onclick = () => { $("camFile").setAttribute("capture", face ? "user" : "environment"); $("camFile").click(); };
    }
  });
}
function endCam(val) { stopCam(); $("vCam").hidden = true; const r = camResolve; camResolve = null; if (r) r(val || null); }
$("camCancel").onclick = () => endCam(null);
$("camSnap").onclick = async () => {
  const v = $("camVid"); if (!v.videoWidth) return;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  const kind = $("camFrame").classList.contains("face") ? "selfie" : "doc";
  try { endCam(await compress(c.toDataURL("image/jpeg", 0.9), kind === "selfie" ? 640 : 1100, kind === "selfie" ? 140000 : 300000)); } catch (e) { endCam(null); }
};
$("camFile").onchange = (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const fr = new FileReader(), kind = $("camFrame").classList.contains("face") ? "selfie" : "doc";
  fr.onload = async () => { try { endCam(await compress(fr.result, kind === "selfie" ? 640 : 1100, kind === "selfie" ? 140000 : 300000)); } catch (x) { endCam(null); } };
  fr.readAsDataURL(f);
};

const W = { step: 0, c1: false, c2: false, adult: false, name: "", dni: "", phone: "", city: "", selfie: "", front: "", back: "", busy: false, msg: "" };

}

function sync() { const b = document.querySelector('#wzBody [data-act="next"]'); if (b) b.disabled = !(W.c1 && W.c2 && W.adult); }
$("wzBack").onclick = () => { if (W.busy) return; W.msg = ""; if (W.step === 0) { enterHome(); } else { W.step--; renderWizard(); } };
$("wzBody").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b || W.busy) return;
  const a = b.getAttribute("data-act"); W.msg = "";
  if (a === "next") { W.step++; renderWizard(); window.scrollTo(0, 0); }
  else if (a === "datos") {
    W.name = $("fName").value.trim(); W.dni = $("fDni").value.replace(/\D/g, ""); W.phone = $("fPhone").value.replace(/\D/g, ""); W.city = $("fCity").value.trim();
    if (W.name.length < 5 || W.name.indexOf(" ") < 0) W.msg = "Escribe tu nombre completo.";
    else if (!/^\d{8}$/.test(W.dni)) W.msg = "El DNI tiene 8 dígitos.";
    else if (!/^9\d{8}$/.test(W.phone)) W.msg = "El celular tiene 9 dígitos y empieza en 9.";
    else if (W.city.length < 2) W.msg = "Escribe tu ciudad.";
    if (W.msg) { renderWizard(); return; }
    W.step++; renderWizard(); window.scrollTo(0, 0);
  } else if (a === "shot") {
    const k = b.getAttribute("data-k"), img = await takePhoto(k);

  } else if (a === "send") {
    W.busy = true; W.msg = "Enviando… no cierres la página."; renderWizard();
    let step = "inicio";
    try {
      for (const k of [["selfie", W.selfie], ["front", W.front], ["back", W.back]]) { step = "foto " + k[0]; await setDoc(doc(db, "kyc", me.uid, "imgs", k[0]), { data: k[1], at: Date.now() }); }
      step = "perfil";
      const base = { name: W.name, dni: W.dni, phone: W.phone, city: W.city, email: me.email, provider: me.provider, status: "pendiente", submittedAt: serverTimestamp(), consentAt: serverTimestamp(), consentVersion: CONSENT_VERSION };
      if (!profile) await setDoc(doc(db, "users", me.uid), Object.assign({ createdAt: serverTimestamp() }, base));
      else await updateDoc(doc(db, "users", me.uid), base);
      W.busy = false; W.selfie = W.front = W.back = ""; enterHome();

/* ---------- red: ejemplares y mercado ---------- */
const CATS = ["Alimento", "Salud y vitaminas", "Jaulas y corrales", "Accesorios", "Equipos", "Otros"];
const MAXPOST = 6;
let posts = [], postsLoaded = false, unsubPosts = null, postsErr = "", tab = "in", q = "", mcat = "Todos", pend = null, fkind = "ejemplar", fPh = [], fBusy = false;
const isVer = () => statusOf() === "verificado";
const okImg = (s) => typeof s === "string" && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s);
function startPosts() {
  if (unsubPosts || !isVer()) return;
  const redraw = () => { if (view === "home" && tab !== "pf") renderTab(); };
  unsubPosts = onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(120)),
    (s) => { posts = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); postsLoaded = true; postsErr = ""; redraw(); },
    (e) => { postsErr = errText(e); postsLoaded = true; redraw(); });
}
function stopPosts() { if (unsubPosts) { unsubPosts(); unsubPosts = null; } posts = []; postsLoaded = false; }
function enterHome() {
  view = "home";
  if (isVer()) startPosts(); else { stopPosts(); tab = "pf"; }
  if (tab === "pf") { renderHome(); show("vHome"); } else { renderTab(); show("vTabs"); }
}
document.querySelectorAll("#nav button").forEach((b) => { b.onclick = () => { tab = b.getAttribute("data-t"); q = ""; pend = null; $("tMsg").textContent = ""; enterHome(); }; });
function paintNav() { document.querySelectorAll("#nav button").forEach((b) => b.setAttribute("aria-current", String(b.getAttribute("data-t") === tab))); }

function cardHtml(p) {
  const mine = p.owner === me.uid, ph = (p.photos || []).filter(okImg);
  const tags = [];
  if (p.type === "producto" && p.cat) tags.push(p.cat);
  if (p.age) tags.push(p.age + " meses");
  if (p.weight) tags.push(p.weight + " kg");
  if (p.city) tags.push(p.city);
  let acts = "";
  if (!p.sold && !mine && /^9\d{8}$/.test(p.ownerPhone || "")) {
    const msg = "Hola " + (p.ownerName || "") + ', vi tu ' + (p.type === "ejemplar" ? "ejemplar" : "producto") + ' "' + (p.title || "") + '" en KELSO.';
    acts += '<a class="btn sm green" target="_blank" rel="noopener" href="https://wa.me/51' + esc(p.ownerPhone) + "?text=" + encodeURIComponent(msg) + '">WhatsApp</a>';
  }
  const ask = (act, label, cls) => (pend === act + p.id ? '<button class="btn sm red" data-a="' + act + '" data-id="' + esc(p.id) + '" type="button">Confirmar</button>' : '<button class="btn sm ' + cls + '" data-a="' + act + '" data-id="' + esc(p.id) + '" type="button">' + label + "</button>");
  if (mine) acts += ask("sold", p.sold ? "Reactivar" : (p.type === "ejemplar" ? "Marcar vendido" : "Marcar agotado"), "sec") + ask("del", "Eliminar", "sec");
  else if (isAdmin) acts += ask("del", "Retirar (admin)", "sec");
  return '<article class="post">' + (ph.length ? '<div class="ph">' + ph.map((x) => '<img src="' + x + '" alt="Foto">').join("") + "</div>" : "") +
    '<div class="in"><div class="row"><div class="ti">' + esc(p.title) + "</div>" + (p.sold ? '<span class="sold">' + (p.type === "ejemplar" ? "Vendido" : "Agotado") + "</span>" : '<div class="pr">S/ ' + esc(p.price) + "</div>") + "</div>" +
    (p.line ? '<div class="mu" style="color:var(--mu);font-size:12.5px;margin-top:2px">' + esc(p.line) + "</div>" : "") +
    '<div class="tags">' + tags.map((t) => '<span class="tag">' + esc(t) + "</span>").join("") + "</div>" +
    (p.desc ? "<p>" + esc(p.desc) + "</p>" : "") +
    '<div class="seller"><b>' + esc(p.ownerName || "Criador") + "</b>" + badge("verificado") + "</div>" +
    (acts ? "<div>" + acts + "</div>" : "") + "</div></article>";
}
function inicioHtml() {
  const nE = posts.filter((p) => p.type === "ejemplar" && !p.sold).length, nM = posts.filter((p) => p.type === "producto" && !p.sold).length;
  const first = ((profile && profile.name) || me.name || "").split(" ")[0] || "criador";
  let h = "<h2>Inicio</h2>" + '<div class="card" style="margin-top:0"><b>Hola, ' + esc(first) + "</b>" + badge("verificado") + '<p class="mu">Esta es la red de criadores verificados de KELSO. Solo ves y publicas aquí porque el administrador verificó tu identidad.</p></div>' +
    '<div class="stat"><div><b>' + nE + "</b>ejemplares disponibles</div><div><b>" + nM + "</b>productos disponibles</div></div>" +
    '<button class="btn" data-go="ej" type="button">Publicar un ejemplar</button><button class="btn sec" data-go="mk" type="button">Publicar un producto</button>' +
    "<h3>Lo último publicado</h3>";

  else if (postsErr) h += '<p class="msg err">' + esc(postsErr) + "</p>";
  else if (!posts.length) h += '<div class="card"><b>Aún no hay publicaciones</b><p class="mu">Sé el primero en publicar un ejemplar o un producto.</p></div>';
  else h += posts.slice(0, 4).map(cardHtml).join("");
  h += '<p class="fine" style="margin-top:20px">Los tratos se hacen entre las partes: verifica siempre el ejemplar y a la persona antes de pagar.</p>';
  return h;
}
function listFiltered(type) {
  const t = q.trim().toLowerCase();
  return posts.filter((p) => p.type === type && (type !== "producto" || mcat === "Todos" || p.cat === mcat) &&
    (!t || [p.title, p.line, p.city, p.desc, p.cat, p.ownerName].join(" ").toLowerCase().indexOf(t) >= 0));
}
function renderList() {
  const type = tab === "ej" ? "ejemplar" : "producto", el = $("lst");
  if (!el) return;
  let h;
  if (!postsLoaded) h = '<p class="fine">Cargando…</p>';
  else if (postsErr) h = '<p class="msg err">' + esc(postsErr) + "</p>";
  else {
    const l = listFiltered(type);
    h = l.length ? l.map(cardHtml).join("") : '<div class="card"><b>' + (type === "ejemplar" ? "Aún no hay ejemplares" : "Aún no hay productos") + '</b><p class="mu">' + (q || mcat !== "Todos" ? "Prueba con otra búsqueda." : "Los miembros verificados pueden publicar aquí.") + "</p></div>";
  }

function renderTab() {
  paintNav();
  if (tab === "in") { $("tBody").innerHTML = inicioHtml(); return; }
  const ej = tab === "ej";
  let h = "<h2>" + (ej ? "Ejemplares" : "Mercado") + "</h2>" +
    '<button class="btn" data-new="' + (ej ? "ejemplar" : "producto") + '" type="button" style="margin-top:0">' + (ej ? "Publicar ejemplar" : "Publicar producto") + "</button>" +
    '<input id="qIn" type="search" placeholder="' + (ej ? "Buscar por casta, línea o ciudad" : "Buscar producto o ciudad") + '" value="' + esc(q) + '" autocomplete="off" style="margin-top:12px">';
  if (!ej) h += '<div class="chips">' + ["Todos"].concat(CATS).map((c) => '<button class="chip" data-cat="' + esc(c) + '" aria-pressed="' + (mcat === c) + '" type="button">' + esc(c) + "</button>").join("") + "</div>";
  h += '<div id="lst"></div>';
  $("tBody").innerHTML = h;
  $("qIn").oninput = (e) => { q = e.target.value; renderList(); };
  renderList();
}
$("tBody").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-go")) { tab = b.getAttribute("data-go"); enterHome(); openForm(tab === "ej" ? "ejemplar" : "producto"); return; }
  if (b.hasAttribute("data-new")) { openForm(b.getAttribute("data-new")); return; }
  if (b.hasAttribute("data-cat")) { mcat = b.getAttribute("data-cat"); renderTab(); return; }
  const a = b.getAttribute("data-a"), id = b.getAttribute("data-id");
  if (!a) return;
  if (pend !== a + id) { pend = a + id; renderTab(); return; }
  pend = null; $("tMsg").textContent = "";
  const p = posts.find((x) => x.id === id);
  try {
    if (a === "del") await deleteDoc(doc(db, "posts", id));
    else if (a === "sold" && p) await updateDoc(doc(db, "posts", id), { sold: !p.sold });
  } catch (e) { $("tMsg").textContent = errText(e); }
  renderTab();

/* formulario de publicación */
function openForm(kind) {
  const mineN = posts.filter((p) => p.owner === me.uid && p.type === kind && !p.sold).length;
  fkind = kind; fPh = []; fBusy = false; view = "form";
  const ej = kind === "ejemplar";
  let h = "<h2>" + (ej ? "Publicar ejemplar" : "Publicar producto") + "</h2>";
  if (mineN >= MAXPOST) {
    h += '<div class="card"><b>Llegaste al máximo</b><p class="mu">Puedes tener hasta ' + MAXPOST + " publicaciones activas de este tipo. Marca alguna como vendida o elimínala para publicar otra.</p></div>";
    $("fmBody").innerHTML = h; show("vForm"); return;
  }
  h += '<label for="fT">' + (ej ? "Título (casta o nombre)" : "Nombre del producto") + '</label><input id="fT" type="text" maxlength="60" placeholder="' + (ej ? "Ej. Gallo giro fino, 2 años" : "Ej. Maíz amarillo 25 kg") + '">';
  if (ej) h += '<label for="fL">Línea o criadero (opcional)</label><input id="fL" type="text" maxlength="60"><div class="two"><div><label for="fA">Edad (meses)</label><input id="fA" type="tel" inputmode="numeric" maxlength="3"></div><div><label for="fW">Peso (kg)</label><input id="fW" type="text" inputmode="decimal" maxlength="5"></div></div>';
  else h += '<label for="fC">Categoría</label><select id="fC">' + CATS.map((c) => "<option>" + esc(c) + "</option>").join("") + "</select>";
  h += '<div class="two"><div><label for="fP">Precio (S/)</label><input id="fP" type="tel" inputmode="numeric" maxlength="7"></div><div><label for="fCi">Ciudad</label><input id="fCi" type="text" maxlength="40" value="' + esc((profile && profile.city) || "") + '"></div></div>' +
    '<label for="fD">Descripción (opcional)</label><textarea id="fD" maxlength="400" placeholder="' + (ej ? "Pedigrí, vacunas, cómo lo entregas…" : "Marca, estado, cómo lo entregas…") + '"></textarea>' +
    '<label for="fF">Fotos (1 a 3)</label><input id="fF" type="file" accept="image/*" multiple><div class="thumbs" id="fPrev"></div>' +
    '<p class="fine" style="text-align:left">Tu celular (' + esc((profile && profile.phone) || "sin celular") + ') será visible para los criadores verificados, para que te escriban por WhatsApp. El video de hasta 10 segundos estará disponible pronto.</p>' +
    '<div class="msg err" id="fMsg"></div><button class="btn" id="fSend" type="button">Publicar</button>';
  $("fmBody").innerHTML = h; show("vForm");
  $("fF").onchange = async (e) => {
    const fs = Array.from(e.target.files).slice(0, 3); $("fMsg").textContent = "Preparando fotos…";
    try {
      fPh = await Promise.all(fs.map((f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => compress(r.result, 800, 100000).then(res, rej); r.onerror = rej; r.readAsDataURL(f); })));
      $("fPrev").innerHTML = fPh.map((p) => '<img src="' + p + '" alt="">').join(""); $("fMsg").textContent = "";
    } catch (x) { fPh = []; $("fPrev").innerHTML = ""; $("fMsg").textContent = "No se pudo leer alguna foto. Prueba con otra."; }
  };
  $("fSend").onclick = sendPost;
}
$("fmBack").onclick = () => { if (fBusy) return; tab = fkind === "ejemplar" ? "ej" : "mk"; enterHome(); };
async function sendPost() {
  if (fBusy) return;
  const g = (id) => ($(id) ? $(id).value.trim() : ""), ej = fkind === "ejemplar", msg = $("fMsg");
  const d = { type: fkind, owner: me.uid, ownerName: (profile && profile.name) || "", ownerPhone: (profile && profile.phone) || "", title: g("fT"), line: ej ? g("fL") : "", age: ej ? g("fA").replace(/\D/g, "") : "", weight: ej ? g("fW").replace(",", ".") : "", price: g("fP").replace(/\D/g, ""), city: g("fCi"), cat: ej ? "" : g("fC"), desc: g("fD"), photos: fPh, sold: false, createdAt: serverTimestamp() };
  if (!d.title) msg.textContent = "Escribe un título.";
  else if (!/^\d{1,7}$/.test(d.price)) msg.textContent = "Escribe el precio en soles, solo números.";
  else if (!d.city) msg.textContent = "Escribe la ciudad.";
  else if (d.weight && !/^\d{1,2}(\.\d{1,2})?$/.test(d.weight)) msg.textContent = "El peso se escribe como 3.5";
  else if (!fPh.length) msg.textContent = "Agrega al menos una foto.";
  else {
    fBusy = true; $("fSend").disabled = true; msg.textContent = "Publicando…";
    try { await addDoc(collection(db, "posts"), d); tab = ej ? "ej" : "mk"; fBusy = false; enterHome(); return; }
    catch (e) { fBusy = false; $("fSend").disabled = false; msg.textContent = "No se pudo publicar. " + errText(e); return; }
  }
}

/* ---------- panel del administrador ---------- */
let adTab = "p", adDetail = null;
async function openAdmin() { view = "admin"; adDetail = null; show("vAdmin"); await loadAdmin(); }
$("adBack").onclick = () => { if (adDetail) { adDetail = null; loadAdmin(); } else { enterHome(); } };
$("sgP").onclick = () => { adTab = "p"; adDetail = null; loadAdmin(); };
$("sgA").onclick = () => { adTab = "a"; adDetail = null; loadAdmin(); };
async function loadAdmin() {
  $("sgP").setAttribute("aria-pressed", adTab === "p"); $("sgA").setAttribute("aria-pressed", adTab === "a");
  $("adBody").innerHTML = '<p class="fine">Cargando…</p>';
  try {
    const q = adTab === "p" ? query(collection(db, "users"), where("status", "==", "pendiente")) : collection(db, "users");

    }
    let h = '<div class="card"><b>' + esc(u.name) + '</b><div class="mu">DNI ' + esc(u.dni || "—") + '</div><div class="mu">Celular ' + esc(u.phone || "—") + ' · ' + esc(u.city || "") + '</div><div class="mu">' + esc(u.email || "") + '</div>' +
      (u.submittedAt ? '<div class="mu">Solicitud: ' + esc(fmtDate(u.submittedAt)) + '</div>' : "") + badge(u.status) + (u.note ? '<p class="mu">Nota: ' + esc(u.note) + '</p>' : "") + '</div>';
    if (u.status === "pendiente") {
      h += '<h3>Documentos</h3><div class="imgs">' + ["selfie", "front", "back"].map((k) => imgs[k] ? '<div><div class="mu" style="text-align:left">' + (k === "selfie" ? "Selfie" : k === "front" ? "DNI delante" : "DNI atrás") + '</div><img src="' + imgs[k] + '" alt=""></div>' : "").join("") + '</div>';
      if (!imgs.selfie) h += '<div class="msg err">No hay fotos guardadas para esta solicitud.</div>';
    }
    h += '<h3>Decisión</h3><label for="dNote">Nota para el usuario (opcional)</label><textarea id="dNote" maxlength="300"></textarea><div class="msg err" id="dMsg"></div><div>';
    if (u.status === "pendiente" || u.status === "correccion" || u.status === "rechazado") h += '<button class="btn sm green" data-dec="verificado" type="button">Aprobar</button>';
    if (u.status === "pendiente") h += '<button class="btn sm red" data-dec="rechazado" type="button">Rechazar</button><button class="btn sm sec" data-dec="correccion" type="button">Pedir corrección</button>';
    if (u.status === "verificado") h += '<button class="btn sm sec" data-dec="suspendido" type="button">Suspender</button><button class="btn sm sec" data-dec="pendiente_quitar" type="button">Quitar verificación</button>';
    if (u.status === "suspendido") h += '<button class="btn sm green" data-dec="verificado" type="button">Reactivar</button>';
    h += '</div>';
    $("adBody").innerHTML = h;
  } catch (e) { $("adBody").innerHTML = '<div class="msg err">No se pudo abrir. ' + esc(errText(e)) + '</div>'; }
}
$("adBody").addEventListener("click", async (e) => {
  const o = e.target.closest("[data-open]"); if (o) { openUser(o.getAttribute("data-open")); return; }
  const d = e.target.closest("[data-dec]"); if (!d || !adDetail) return;
  let st = d.getAttribute("data-dec"); const note = $("dNote") ? $("dNote").value.trim() : "";
  if (st === "pendiente_quitar") st = "correccion";
  if ((st === "rechazado" || st === "correccion" || st === "suspendido") && !note) { $("dMsg").textContent = "Escribe una nota para el usuario."; return; }
  document.querySelectorAll("#adBody [data-dec]").forEach((b) => { b.disabled = true; });
  try {
    await updateDoc(doc(db, "users", adDetail), { status: st, note: st === "verificado" ? "" : note, reviewedAt: serverTimestamp(), reviewedBy: me.uid });
    try { await addDoc(collection(db, "adminLog"), { admin: me.uid, action: st, target: adDetail, at: serverTimestamp() }); } catch (x) {}
    if (st === "verificado" || st === "rechazado" || st === "correccion") {
      for (const k of ["selfie", "front", "back"]) { try { await deleteDoc(doc(db, "kyc", adDetail, "imgs", k)); } catch (x) {} }
    }
    adDetail = null; await loadAdmin();
  } catch (er) { $("dMsg").textContent = "No se pudo guardar. " + errText(er); document.querySelectorAll("#adBody [data-dec]").forEach((b) => { b.disabled = false; }); }
});
</script></body></html>
